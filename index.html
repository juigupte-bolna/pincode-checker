<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pincode serviceability check</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 16px; }
  input, button { font-size: 16px; padding: 8px; }
  input { width: 160px; }
  pre { background: #f4f4f4; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h2>Check pincode serviceability</h2>
  <input id="pin" placeholder="6-digit pincode" maxlength="6" />
  <button onclick="check()">Check</button>
  <pre id="out"></pre>
  <script>
    async function check() {
      const pin = document.getElementById('pin').value.trim();
      const out = document.getElementById('out');
      out.textContent = 'Checking...';
      const r = await fetch(`/api/check-pincode?pincode=${encodeURIComponent(pin)}`);
      out.textContent = JSON.stringify(await r.json(), null, 2);
    }
  </script>
</body>
</html>
